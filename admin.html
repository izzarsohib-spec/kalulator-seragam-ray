<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrator - Kalkulator Estimasi</title>
<link rel="stylesheet" href="gaya.css">
</head><body>
<header class="atas"><div><h1>Administrator</h1><small>Ubah, tambah, atau hapus harga seragam dan peralatan</small></div><a href="index.html">Kembali ke kalkulator</a></header>
<main>
  <section class="kartu">
    <div class="banner" id="info">Perubahan di halaman ini <b>belum tersimpan</b> sampai Anda menekan <b>Unduh harga.json</b> dan mengganti file <code>harga.json</code> di repo. Kalkulator hanya membaca file itu.</div>
    <div class="tabs"><button class="tab aktif" data-j="seragam">Seragam</button><button class="tab" data-j="peralatan">Peralatan</button></div>
    <div class="bar"><input class="cari" id="cari" type="search" placeholder="Cari nama barang"><button class="btn utama" id="tambah">+ Tambah item</button><button class="btn utama" id="unduh">Unduh harga.json</button><button class="btn" id="batal" hidden>Buang perubahan</button></div>
    <div class="catatan" id="status" style="margin:0 0 8px"></div>
    <table class="adm"><thead><tr><th>Kategori</th><th>Nama</th><th class="r">Harga jual</th><th></th></tr></thead><tbody id="tbody"></tbody></table>
  </section>
</main>

<dialog id="dlg"><form method="dialog" id="form">
  <h3 id="dJudul" style="margin-top:0"></h3>
  <label class="f">Jenis<select id="fJenis"><option value="seragam">Seragam</option><option value="peralatan">Peralatan</option></select></label>
  <label class="f">Kategori<input id="fKat" list="daftarKat" required></label><datalist id="daftarKat"></datalist>
  <label class="f">Nama barang<input id="fNama" required></label>
  <label class="f">Harga jual (Rp)<input id="fHarga" type="number" min="0" required></label>
  <div class="pesan" id="pForm"></div>
  <div class="aksi"><button class="btn utama" type="submit">Simpan</button><button class="btn" id="dBatal" type="button">Batal</button></div>
</form></dialog>
<div class="toast" id="toast"></div>
<script src="umum.js"></script>
<script>
const $ = id => document.getElementById(id);
let SEMUA = [], ASLI = '', jenis = 'seragam', kunci = '', edit = null;
const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('tampil'); setTimeout(() => e.classList.remove('tampil'), 1800); };
const berubah = () => JSON.stringify(SEMUA) !== ASLI;

async function muat() {
  try { SEMUA = await muatDaftar(); ASLI = JSON.stringify(SEMUA); gambar(); }
  catch (e) { $('status').textContent = 'Gagal memuat harga.json: ' + e.message; }
}
function gambar() {
  const q = kunci.trim().toLowerCase();
  const baris = SEMUA.filter(r => r.jenis === jenis && (!q || (r.nama + ' ' + r.kategori).toLowerCase().includes(q)));
  $('tbody').innerHTML = baris.length ? baris.map(r => `<tr><td>${esc(r.kategori)}</td><td><b>${esc(r.nama)}</b></td><td class="r">${rp(r.harga)}</td>
    <td class="r"><button class="btn" data-a="ubah" data-id="${r.id}">Ubah</button> <button class="btn bahaya" data-a="hapus" data-id="${r.id}">Hapus</button></td></tr>`).join('')
    : '<tr><td colspan="4" class="kosong">Tidak ada item.</td></tr>';
  $('status').textContent = `${SEMUA.length} item (${SEMUA.filter(r => r.jenis === 'seragam').length} seragam, ${SEMUA.filter(r => r.jenis === 'peralatan').length} peralatan)` + (berubah() ? ' · ada perubahan yang belum diunduh' : '');
  $('batal').hidden = !berubah();
}
function bukaForm(r) {
  edit = r || null; $('dJudul').textContent = r ? 'Ubah item' : 'Tambah item'; $('pForm').textContent = '';
  $('fJenis').value = r ? r.jenis : jenis; $('fKat').value = r ? r.kategori : (jenis === 'peralatan' ? 'Peralatan' : '');
  $('fNama').value = r ? r.nama : ''; $('fHarga').value = r ? r.harga : '';
  $('daftarKat').innerHTML = [...new Set(SEMUA.map(x => x.kategori))].map(k => `<option value="${esc(k)}">`).join('');
  $('dlg').showModal(); $('fNama').focus();
}

$('cari').addEventListener('input', e => { kunci = e.target.value; gambar(); });
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; jenis = b.dataset.j; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('aktif', x === b)); gambar(); });
$('tambah').addEventListener('click', () => bukaForm(null));
$('dBatal').addEventListener('click', () => $('dlg').close());
$('tbody').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const r = SEMUA.find(x => x.id == b.dataset.id); if (!r) return;
  if (b.dataset.a === 'ubah') return bukaForm(r);
  if (!confirm(`Hapus "${r.nama}"?`)) return;
  SEMUA = SEMUA.filter(x => x !== r); toast('Item dihapus (belum diunduh)'); gambar();
});
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const j = $('fJenis').value, k = $('fKat').value.trim(), n = $('fNama').value.trim(), h = Math.round(+$('fHarga').value);
  if (!k || !n) return $('pForm').textContent = 'Nama dan kategori wajib diisi.';
  if (!(h >= 0)) return $('pForm').textContent = 'Harga wajib diisi dan tidak boleh negatif.';
  if (SEMUA.some(x => x.jenis === j && x.nama.toLowerCase() === n.toLowerCase() && x !== edit)) return $('pForm').textContent = 'Item dengan nama itu sudah ada.';
  if (edit) Object.assign(edit, { jenis: j, kategori: k, nama: n, harga: h });
  else SEMUA.push({ id: Math.max(0, ...SEMUA.map(x => x.id)) + 1, jenis: j, kategori: k, nama: n, harga: h });
  $('dlg').close(); jenis = j; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('aktif', x.dataset.j === jenis));
  toast('Diubah (belum diunduh)'); gambar();
});
$('batal').addEventListener('click', () => { if (confirm('Buang semua perubahan yang belum diunduh?')) muat(); });
$('unduh').addEventListener('click', () => {
  const urut = [...SEMUA].sort((a, b) => a.jenis.localeCompare(b.jenis) || a.kategori.localeCompare(b.kategori) || a.nama.localeCompare(b.nama));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(urut, null, 1)], { type: 'application/json' }));
  a.download = 'harga.json'; a.click(); URL.revokeObjectURL(a.href); toast('harga.json diunduh. Ganti file di repo.');
});
window.addEventListener('beforeunload', e => { if (berubah()) { e.preventDefault(); e.returnValue = ''; } });
muat();
</script>
</body></html>
